name: Inventariar figuras

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'figuras_manual_desempeno.zip'
      - '.github/workflows/inventariar-figuras.yml'

permissions:
  contents: write

jobs:
  inventario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Listar contenido del ZIP
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          z=Path('figuras_manual_desempeno.zip')
          with zipfile.ZipFile(z) as f:
              names=f.namelist()
          Path('inventario_figuras_detectadas.txt').write_text('\n'.join(names)+'\n', encoding='utf-8')
          print('\n'.join(names))
          PY
      - name: Guardar inventario
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventario_figuras_detectadas.txt
          if git diff --cached --quiet; then
            echo 'Sin cambios.'
          else
            git commit -m 'Inventariar figuras del manual'
            git push
          fi
